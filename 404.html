<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Page Not Found | Samora AI</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/images/favicon.png" type="image/png"/>
<style>
@font-face{font-family:'General Sans';src:url('/fonts/GeneralSans-Regular.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'General Sans';src:url('/fonts/GeneralSans-Medium.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'General Sans';src:url('/fonts/GeneralSans-Semibold.otf') format('opentype');font-weight:600;font-style:normal;font-display:swap}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#36233a;
  --purple:#7f0ca6;
  --purple-light:#ce9ffc;
  --white:#fff;
  --gray-50:#faf9fb;
  --gray-200:#e8e3ec;
  --gray-400:#9b8fa0;
  --gray-600:#6b5870;
  --bg-dark:#2a1a2d;
  --gradient-cta:linear-gradient(135deg,#ce9ffc,#9b5cf6);
  --font:'General Sans',Arial,sans-serif;
}
html,body{min-height:100%}
body{font-family:var(--font);color:var(--primary);background:var(--gray-50);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:10;width:auto;max-width:860px}
.nav-inner{display:flex;align-items:center;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(54,35,58,.06);border-radius:72px;padding:6px 6px 6px 20px;box-shadow:0 4px 24px rgba(54,35,58,.06)}
.nav-logo{display:flex;align-items:center;padding-right:20px}
.nav-logo img{height:30px;display:block}
.nav-link{font-size:14px;font-weight:500;color:var(--gray-600);padding:9px 16px;border-radius:60px;white-space:nowrap}
.nav-link:hover{color:var(--primary);background:rgba(54,35,58,.06)}
.not-found{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:140px 32px 80px;text-align:center;position:relative;overflow:hidden}
.not-found::before{content:'';position:absolute;inset:0;background:
  radial-gradient(ellipse 80% 60% at 20% 80%,rgba(127,12,166,.12),transparent 60%),
  radial-gradient(ellipse 70% 50% at 80% 20%,rgba(206,159,252,.15),transparent 60%);
  pointer-events:none}
.content{position:relative;z-index:1;max-width:620px;margin:0 auto}
.eyebrow{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--purple);margin-bottom:16px}
h1{font-size:48px;line-height:1.1;letter-spacing:-.02em;font-weight:600;margin-bottom:16px}
p{font-size:18px;color:var(--gray-600);max-width:520px;margin:0 auto 32px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:60px;padding:14px 28px;font-size:15px;font-weight:600;transition:all .2s}
.btn-primary{background:var(--gradient-cta);color:var(--white);box-shadow:0 4px 20px rgba(155,92,246,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(155,92,246,.32)}
.btn-secondary{background:var(--white);border:1px solid var(--gray-200);color:var(--primary)}
.btn-secondary:hover{border-color:var(--purple-light)}
.footer{background:var(--bg-dark);color:var(--white);padding:32px 0}
.footer-inner{max-width:1120px;margin:0 auto;padding:0 32px}
.footer-links{display:flex;flex-wrap:wrap;gap:14px 20px;font-size:12px;color:rgba(255,255,255,.55);margin-bottom:16px}
.footer-links a:hover{color:var(--white)}
.footer-bottom{font-size:12px;opacity:.35}
@media(max-width:600px){
  .nav{max-width:calc(100% - 24px)}
  .nav-inner{padding:4px 12px}
  .nav-logo img{height:24px}
  h1{font-size:34px}
  p{font-size:16px}
  .actions{flex-direction:column}
}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><img src="/images/logo-1.png" alt="Samora AI"/></a>
    <a href="/" class="nav-link">Back to site</a>
  </div>
</nav>
<main class="not-found">
  <div class="content">
    <div class="eyebrow">404</div>
    <h1>Page not found</h1>
    <p>The page you are looking for may have moved, or the link may be incorrect.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Go to homepage</a>
      <a class="btn btn-secondary" href="/#eligibility">Check eligibility</a>
    </div>
  </div>
</main>
<footer class="footer">
  <div class="footer-inner">
    <div class="footer-links">
      <a href="/privacy-policy/">Privacy Policy</a>
      <a href="/terms-and-conditions/">Terms and Conditions</a>
      <a href="/accessibility-statement/">Accessibility Statement</a>
    </div>
    <div class="footer-bottom">&copy; 2025 Nclude, Inc. All rights reserved.</div>
  </div>
</footer>
</body>
</html>
