name = "samora-care"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-21"

# Consumed by functions/api/lead.ts. Declared here rather than in the dashboard
# because a project with a wrangler.toml ignores dashboard-defined vars.
[vars]
LEAD_ENDPOINT = "https://script.google.com/macros/s/AKfycbzfLPVR_VHKA_NcuCDckmngr4oPQ5cIJ5M9b8F0Yu5laUeM1PbaTQmI7Gw1ZaYJ-nEu/exec"

# Durable landing spot for a submission, written before the visitor is told the
# form went through. Forwarding to Apps Script then happens after the response,
# so a slow Sheet write no longer holds anyone on the last screen. Declared here
# because a project with a wrangler.toml ignores dashboard bindings.
[[kv_namespaces]]
binding = "LEADS"
id = "c879fa3a5a32405093ae64d1ead422e3"
